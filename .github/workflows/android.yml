# Her push'ta: Android APK derlemesi (test yok — testleri oyuncu telefonda yapar).
# APK, GitHub'da "Releases" sayfasına "latest" etiketiyle yüklenir -> telefondan indirip kurabilirsin.
name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android NDK kur
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-37" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo-ndk kur
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v6

      - name: APK derle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.3.${{ github.run_number }}-beta
          # Supabase (isteğe bağlı): başka bir projeye geçmek için Secrets'a SB_URL / SB_KEY eklenebilir
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          ./gradlew assembleRelease assembleDebug --console=plain
          mkdir -p ../dist ../dist-debug
          cp app/build/outputs/apk/release/app-release.apk ../dist/ZenvexOnline-0.3.${{ github.run_number }}-beta.apk
          # emülatör testi: otomatik gösterim yalnız hata ayıklama sürümünde çalışır (yayın sürümü çevrimdışı oynatmaz)
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-debug/ZenvexOnline-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: ZenvexOnline-apk
          path: dist/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: ZenvexOnline-debug-apk
          path: dist-debug/*.apk

      - name: latest etiketini bu commit'e taşı
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Sürüm sayfasına yükle
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Zenvex Online — son derleme (0.2.${{ github.run_number }})"
          body: |
            Telefonuna kurmak için aşağıdaki **ZenvexOnline-0.2.${{ github.run_number }}.apk** dosyasına dokun.
            İlk kurulumda "Bilinmeyen kaynaklardan yüklemeye izin ver" demen gerekebilir.
            Dal: `${{ github.ref_name }}` · Commit: `${{ github.sha }}`
          artifacts: dist/*.apk
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: true

  # Emülatörde uygulamayı açıp ekranları gezer (Demo.kt); görüntüler + logcat "ui-shots" olarak yüklenir.
  ui-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Android 9 (en eski desteklenen) ve Android 15 (16 KB sayfa / kenardan kenara)
        api: [28, 35]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ZenvexOnline-debug-apk
          path: apk

      - name: KVM aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde aç ve gez
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: bash .github/scripts/ui_smoke.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-shots-api${{ matrix.api }}
          path: artifacts/
